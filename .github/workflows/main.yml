---
name: rerobots JS tests
on:
    push:
    pull_request:
jobs:
    build-and-test:
        name: Build and test
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                node: ['22', '24', '26']
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: ${{ matrix.node }}
                cache: yarn
            - name: Installation
              run: yarn install --frozen-lockfile
            - name: Lint
              if: ${{ matrix.node == 24 }}
              run: |
                yarn lint
            - name: Test
              run: yarn test
